<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>main폼</title>
	<th:block th:replace="~{/top.html}"></th:block>
	<!-- 제이쿼리 -->	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
	<script src="http://ajax.googleapis.com/ajax/libs/jquery/2.0.0/jquery.min.js"></script>
	<!-- bxSlider -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">	
	<!-- kakao daum 주소 검색 -->
	<script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>	
	<!-- 슬립 사용 -->
	<script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
	<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4/dist/jquery.bxslider.css" />	

	<!-- 개발자 설정: slick -->	 
	<link th:href="@{/css/slick.css}" rel="stylesheet" >
	<link th:href="@{/css/slick-theme.css}" rel="stylesheet">
	<script th:src="@{/js/main.js}"></script>
		
	<style>
/*		body {
			background:#f8f8f8;
			margin:0;
		}*/
		
		.slider-wrap {
			max-width:1600px;
			margin:0 auto;
			padding:70px 0;
		}

		.car-slide {
			text-align:center;
		}

		.car-title {
			font-size:71px;
			font-weight:800;
			margin-bottom:20px;
		}

		.car-sub {
			font-size:23px;
			font-weight:400;
			margin-bottom:40px;
		}

		.car-img {
			/*width:100%;*/
			/*max-width:1200px;*/
			margin:auto;
			width: 1200px;
			height: 600px;
		}

		/* bxSlider 기본 박스 제거 */
		.bx-wrapper {
			background:none;
			border:none;
			box-shadow:none;
		}

		/* 양쪽 네비게이션 */
		.bx-wrapper .bx-prev {
			left:-80px;
		}
		.bx-wrapper .bx-next {
			right:-80px;
		}
	</style>
</head>

<body>
	
	<div class="slider-wrap">
		<ul class="bxslider">

			<!-- IONIQ 6 N -->
			<li class="car-slide">
				<div class="car-title">IONIQ 6 N</div>
				<div class="car-sub">Rule the Paradigm</div>
				<img th:src="@{/icons/main_kv_ioniq6_n_pc.png}" class="car-img">
			</li>

			<!-- SONATA The Edg -->
			<li class="car-slide">
				<div class="car-title">SONATA The Edge</div>
				<div class="car-sub">익숙함도 완전히 새롭게</div>
				<img th:src="@{/icons/main_sonata_25my_w.png}" class="car-img">
			</li>

			<!-- IONIQ 5 N -->
			<li class="car-slide">
				<div class="car-title">IONIQ 5 N</div>
				<div class="car-sub">Everyday N Life</div>
				<img th:src="@{/icons/Main-KV_Car_IONIQ-5-N.png}" class="car-img">
			</li>
			
			<!-- SANTA FE -->
			<li class="car-slide">
				<div class="car-title">SANTA FE</div>
				<div class="car-sub">일상과 일상 사이를 열다</div>
				<img th:src="@{/icons/main-santafe-25my-kv-w.png}" class="car-img">
			</li>
			<!-- TUCSON -->
			<li class="car-slide">
				<div class="car-title">TUCSON</div>
				<div class="car-sub">날개를 달다</div>
				<img th:src="@{/icons/Main-KV_Car_TUCSON.png}" class="car-img">
			</li>
			<!-- IONIQ 6 -->
			<li class="car-slide">
				<div class="car-title">IONIQ 6</div>
				<div class="car-sub">새로운 흐름의 시작</div>
				<img th:src="@{/icons/main_kv_ioniq6_pc.png}" class="car-img">
			</li>
			<!-- 2026 CASPER Electric -->					
			<li class="car-slide">
				<div class="car-title">2026 CASPER Electric</div>
				<div class="car-sub">아이코닉한 디자인의 완성</div>
				<img th:src="@{/icons/Main-KV_Car_CASPER-Electric.png}" class="car-img">
			</li>	
		</ul>
	</div>
	
	<th:block th:replace="~{/bottom.html}"></th:block>	
</body>

</html>
