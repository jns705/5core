<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상담 신청 명단 - HYUNDAI CRM</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; height: 100vh; background: #f5f6f8; }

    /* 사이드바 */
    .sidebar {
      width: 240px;
      background: #0d47a1;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 24px 0;
    }
    .sidebar h2 {
      font-size: 20px;
      font-weight: 700;
      padding: 0 24px;
      margin-bottom: 24px;
    }
    .menu-item {
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
	  color: #fff;
    }
    .menu-item:hover { background: rgba(255,255,255,0.15); }
	.sidebar > a {
		text-decoration-line: none;
	}

    /* 메인 */
    .main { flex: 1; display: flex; flex-direction: column; }
    .header {
      height: 64px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #ddd;
    }
    .logo { font-size: 22px; font-weight: 700; color: #0d47a1; }
    .user-info { font-size: 15px; color: #333; }
    .logout { margin-left: 6px; color: #0d47a1; font-weight: 600; }

    /* 콘텐츠 */
    .content { padding: 24px; overflow-y: auto; }

    /* 카드 */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table thead {
      background: #e3eefc;
      color: #0d47a1;
      font-weight: 600;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
      text-align: center;
    }

    /* 상태 뱃지 */
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }
    .badge.waiting { background: #ffebee; color: #c62828; }
    .badge.progress { background: #e3f2fd; color: #1565c0; }
    .badge.done { background: #e8f5e9; color: #2e7d32; }

    /* 셀렉트/버튼 */
    .status-select {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .update-btn {
      padding: 6px 10px;
      margin-left: 6px;
      border: none;
      background: #0d47a1;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .update-btn:hover { background: #093c8a; }
  </style>
</head>

<body>
  <!-- 사이드바 -->
  <div class="sidebar">
    <h2>관리 메뉴</h2>
	<a th:href="@{/dealer}"><div class="menu-item">딜러 프로필</div></a>
	<a th:href="@{/dealer/care}"><div class="menu-item">고객 관리</div></a>
	<a><div class="menu-item">상담 신청 명단</div></a>
	<a><div class="menu-item">구매 관리</div></a>
	<a><div class="menu-item">보고서 / 분석</div></a>
  </div>

  <!-- 메인 -->
  <div class="main">
    <div class="header">
      <div class="logo">HYUNDAI CRM</div>
      <div class="user-info">
        홍길동 님
        <a href="#" class="logout">로그아웃</a>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <h2 style="color:#0d47a1; margin-bottom:12px;">상담 신청 명단</h2>

        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>신청일</th>
              <th>신청자</th>
              <th>연락처</th>
              <th>상담희망일</th>
              <th>신청현황</th>
              <th>변경</th>
            </tr>
          </thead>

          <tbody>
            <!-- 샘플 데이터 행 -->
            <tr>
              <td>1</td>
              <td>2025-02-01</td>
              <td>김민수</td>
              <td>010-1234-5678</td>
              <td>2025-02-05</td>
              <td><span class="badge waiting">대기</span></td>
              <td>
                <select class="status-select">
                  <option>대기</option>
                  <option>진행중</option>
                  <option>완료</option>
                </select>
                <button class="update-btn">수정</button>
              </td>
            </tr>

            <tr>
              <td>2</td>
              <td>2025-02-02</td>
              <td>박지현</td>
              <td>010-9876-5432</td>
              <td>2025-02-08</td>
              <td><span class="badge progress">진행중</span></td>
              <td>
                <select class="status-select">
                  <option>대기</option>
                  <option selected>진행중</option>
                  <option>완료</option>
                </select>
                <button class="update-btn">수정</button>
              </td>
            </tr>

            <tr>
              <td>3</td>
              <td>2025-02-03</td>
              <td>이도현</td>
              <td>010-2222-3333</td>
              <td>2025-02-10</td>
              <td><span class="badge done">완료</span></td>
              <td>
                <select class="status-select">
                  <option>대기</option>
                  <option>진행중</option>
                  <option selected>완료</option>
                </select>
                <button class="update-btn">수정</button>
              </td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
