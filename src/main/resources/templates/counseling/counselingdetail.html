<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매상담 신청</title>
    <link rel="stylesheet" href="css/counselingdetail.css">
</head>
<body>
    <details>
        <summary id="select_bar">Step1.차량선택</summary>
            <img src="/img/avante.jpg">
            <img src="/img/casper.jpg">
            <img src="/img/ev5.jpg">
            <img src="/img/ev6.jpg">
            <img src="/img/ev9.png">
    </details>
    <details>
        <summary id="select_bar">Step2.구매상담 희망지역</summary>
            <select>
                <option>시/도</option>
                <option>부산광역시</option>
                <option>대구광역시</option>
                <option>대전광역시</option>
                <option>울산광역시</option>
                <option>인천광역시</option>
                <option>광주광역시</option>
                <option>세종특별자치시</option>
            </select>
            <select>
                <option>시/군/구</option>
                <option>부산광역시</option>
                <option>대구광역시</option>
                <option>대전광역시</option>
                <option>울산광역시</option>
                <option>인천광역시</option>
                <option>광주광역시</option>
                <option>세종특별자치시</option>
            </select>
            <select>
                <option>읍/면/동</option>
                <option>부산광역시</option>
                <option>대구광역시</option>
                <option>대전광역시</option>
                <option>울산광역시</option>
                <option>인천광역시</option>
                <option>광주광역시</option>
                <option>세종특별자치시</option>
            </select>
    </details>
    <details>
    <summary id="select_bar">Step3.구매희망정보</summary>
        <div>
            <p>더 나은 구매상담을 위해 고객님의 구매 희망 관련 정보를 확인하고 있습니다.</p>
            <p>(*가 표시된 항목은 필수 선택 항목입니다.)</p>
        </div>
        <form action="/submit-survey" method="post">
            <div class="survey-section">
                <p class="question-title required">차량 구매 목적</p>
                <hr>
                <div class="input-group">
                    <input type="checkbox" id="purpose_commute" name="purpose" value="commute">
                    <label for="purpose_commute">출퇴근용</label>
                </div>
                
                <div class="input-group">
                    <input type="checkbox" id="purpose_family" name="purpose" value="family">
                    <label for="purpose_family">패밀리카</label>
                </div>
                
                <div class="input-group">
                    <input type="checkbox" id="purpose_business" name="purpose" value="business">
                    <label for="purpose_business">업무용</label>
                </div>
                
                <div class="input-group">
                    <input type="checkbox" id="purpose_secondcar" name="purpose" value="secondcar">
                    <label for="purpose_secondcar">세컨드카</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="purpose_other" name="purpose" value="other">
                    <label for="purpose_other">기타</label>
                    <input type="text" name="purpose_other_detail" class="other-input" placeholder="기타 사유를 입력하세요">
                </div>
            </div>
            <hr>    
            <div class="survey-section">
                <p class="question-title required">희망 구매 시점</p>
                <hr>
                <div class="input-group">
                    <input type="radio" id="time_1m" name="purchase_time" value="1month">
                    <label for="time_1m">1개월 이내</label>
                </div>
                <div class="input-group">
                    <input type="radio" id="time_3m" name="purchase_time" value="3month">
                    <label for="time_3m">3개월 이내</label>
                </div>
                <div class="input-group">
                    <input type="radio" id="time_6m" name="purchase_time" value="6month">
                    <label for="time_6m">6개월 이내</label>
                </div>
                <div class="input-group">
                    <input type="radio" id="time_undecided" name="purchase_time" value="undecided" checked>
                    <label for="time_undecided">미정</label>
                </div>
            </div>
            <hr>
            <div class="survey-section">
                <p class="question-title">선호 차량 유형</p>
                <hr>
                <div class="input-group">
                    <input type="checkbox" id="type_sedan" name="car_type" value="sedan">
                    <label for="type_sedan">세단</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="type_suv" name="car_type" value="suv">
                    <label for="type_suv">SUV</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="type_other" name="car_type" value="other">
                    <label for="type_other">기타</label>
                </div>
            </div>
            <hr>
            <div class="survey-section">
                <p class="question-title">선호 엔진</p>
                <hr>
                <div class="input-group">
                    <input type="checkbox" id="engine_gas" name="engine" value="gasoline">
                    <label for="engine_gas">가솔린</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="engine_ev" name="engine" value="electric">
                    <label for="engine_ev">전기</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="engine_hybrid" name="engine" value="hybrid">
                    <label for="engine_hybrid">하이브리드</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="engine_fcev" name="engine" value="fcev">
                    <label for="engine_fcev">수소</label>
                </div>
                <div class="input-group">
                    <input type="checkbox" id="engine_n" name="engine" value="high_performance">
                    <label for="engine_n">고성능 (N)</label>
                </div>
                <div class="input-group">
                    <label for="purpose_other">희망연락시간</label>
                    <input type="text" name="purpose_other_detail"  placeholder="원하시는 시간을 적어주세요.">
                    <input type="date" id="purpose_other" name="purpose" value="other">
                </div>
            </div>
        </form>
    </details>
</body>
<button>구매신청</button>
<footer>

</footer>
