<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아코디언 상담 신청</title>
<style>
    .applyContainer {
        font-family: "Pretendard", Arial, sans-serif;
        padding: 30px;
        background: #fff;
        color: #222;
		margin: 100px;
    }
	
	.applyContent {
		padding: 50px;
	}

    .accordion-item {
        border-bottom: 1px solid #ddd;
        padding: 20px;
    }

    .accordion-header {
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        padding: 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .accordion-header:hover {
        color: #0360a1;
    }

    .accordion-arrow {
        transition: 0.3s;
        font-size: 20px;
    }

    .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s ease;
        background: #f6f4f2;
        padding: 0 0;
    }

    .accordion-content.open {
        padding: 25px 10px;
        max-height: 500px;
    }

    /* 예시 입력폼 스타일 */
    .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
        align-items: center;
    }

    .form-row label {
        width: 90px;
        font-weight: 600;
    }
	
	.required::after {
	    content: '*';
	    color: #d9001b;
	    margin-left: 5px;
	}

    .area {
        width: 200px;
        padding: 8px;
        border: 1px solid #ccc;
        appearance: none;
        background: #fff;
    }
	
	.input-group {
	    display: inline-flex;
	    align-items: center;
	    margin-right: 25px;
	    margin-bottom: 10px;
	}

	.input-group input[type="checkbox"],
	.input-group input[type="radio"] {
	    margin-right: 8px;
	    transform: scale(1.2); /* 체크박스/라디오 버튼 크기 키우기 */
	    accent-color: #002c5f; /* 체크 색상 변경 */
	}

	.input-group label {
	    font-weight: 400;
	    cursor: pointer;
	}

	.other-input,
	input[type="text"][placeholder="원하시는 시간을 적어주세요."] {
	    padding: 8px 10px;
	    border: 1px solid #ccc;
	    border-radius: 4px;
	    margin-left: 10px;
	    width: 200px;
	}
	
	/* --- 버튼 영역 --- */
	.btns { text-align: center;}    
	.btns > input[type=button] { 
	     width: 120px; height: 40px;
	     border: 2px solid lightgray; background-color: gray; color: white; 
	     border-radius: 7px;
	     font-size: 1.02em;
	     font-weight: bold;
	     cursor: pointer;
	 }
	 .btns input[type=button]:hover {
	     background-color: white;
	     color: gray;
	     border: 2px solid lightgray;
	 }
	 .btns > input[type=reset] { 
	     width: 120px; height: 40px;
	     border: 2px solid lightgray; background-color: white; color: gray; 
	     border-radius: 7px;
	     font-size: 1.02em;
	     font-weight: bold;
	     cursor: pointer;
	 }  
	 .btns input[type=reset]:hover {
	     background-color: gray;
	     color: white;
	     border: 2px solid lightgray;
	 }
	 
	 .result {
	     width: 900px;
	 }   
</style>
</head>
<body>	
	<div class="applyContainer">
		<form th:object="${counseling}" th:action="@{/counseling/add}" method="post" name="applyForm">
		<h2 style="margin-bottom:30px; font-size:24px;">상담 신청</h2>
			<div class="applyContent">
				<!-- ▼▼▼ Step 1 -->
				<div class="accordion-item">
				   <div class="accordion-header">
				        <span>Step1. 상담 차종 *</span>
				        <span class="accordion-arrow">▼</span>
				    </div>
				    <div class="accordion-content">
				        <p>차량 모델 선택 내용 들어가는 영역</p>
				    </div>
				</div>
	
				<!-- ▼▼▼ Step 2 -->
				<div class="accordion-item">
				    <div class="accordion-header">
				        <span>Step2. 구매 상담 희망 지역 *</span>
				        <span class="accordion-arrow">▼</span>
				    </div>
				    <div class="accordion-content">
				        <div class="form-row">
				            <label>시/도</label>
				            <select class="area" name="sido" id="sido">
				                <option>시/도</option>
				                <option>서울특별시</option>
				                <option>부산광역시</option>
				            </select>	
				            <label>시/군/구</label>
				            <select class="area" name="siGunGu" id="siGunGu">
				                <option>시/군/구</option>
								<option>종로구</option>
								<option>중구</option>
				            </select>
	
				            <label>읍/면/동</label>
				            <select class="area" name="eupMyeonDong" id="eupMyeonDong">
				                <option>읍/면/동</option>
								<option>테스트</option>
				            </select>
				        </div>
					</div>
				</div>
	
				<!-- ▼▼▼ Step 3 -->
				<div class="accordion-item">
				    <div class="accordion-header">
				        <span>Step3. 구매 희망 정보 *</span>
				        <span class="accordion-arrow">▼</span>
				    </div>
				    <div class="accordion-content">
						<div>
						    <p>더 나은 구매상담을 위해 고객님의 구매 희망 관련 정보를 확인하고 있습니다.</p>
							<p>(*가 표시된 항목은 필수 선택 항목입니다.)</p>
						</div>
						   
				        <div class="survey-section">
				            <p class="question-title required">차량 구매 목적</p>
				            <hr>
				            <div class="input-group">
				                <input type="checkbox" id="p1" name="purchasePurpose" value="출퇴근용">
				                <label for="purpose_commute">출퇴근용</label>
								<div class="col-sm-7">
									<p class="text-danger" th:errors="*{purchasePurpose}"></p>		
								</div>					
				            </div>
				            
				            <div class="input-group">
				                <input type="checkbox" id="p2" name="purchasePurpose" value="패밀리카">
				                <label for="purpose_family">패밀리카</label>
								<div class="col-sm-7">
									<p class="text-danger" th:errors="*{purchasePurpose}"></p>		
								</div>	
				            </div>
				            
				            <div class="input-group">
				                <input type="checkbox" id="p3" name="purchasePurpose" value="업무용">
				                <label for="purpose_business">업무용</label>
				            </div>
				            
				            <div class="input-group">
				                <input type="checkbox" id="p4" name="purchasePurpose" value="세컨드카">
				                <label for="purpose_secondcar">세컨드카</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="p5" name="purchasePurpose" value="기타">
				                <label for="purchasePurposeOther">기타</label>
				                <input type="text" name="purchasePurposeOther" class="other-input" placeholder="기타 사유를 입력하세요">
				            </div>
				        </div>
						<hr>    
				        <div class="survey-section">
				            <p class="question-title required">희망 구매 시점</p>
				            <hr>
				            <div class="input-group">
				                <input type="radio" id="pt1m" name="purchasePeriod" value="1개월 이내">
				                <label for="time_1m">1개월 이내</label>
				            </div>
				            <div class="input-group">
				                <input type="radio" id="pt3m" name="purchasePeriod" value="3개월 이내">
				                <label for="time_3m">3개월 이내</label>
				            </div>
				            <div class="input-group">
				                <input type="radio" id="pt6m" name="purchasePeriod" value="6개월 이내">
				                <label for="time_6m">6개월 이내</label>
				            </div>
				            <div class="input-group">
				                <input type="radio" id="ptNon" name="purchasePeriod" value="미정" checked>
				                <label for="ptNon">미정</label>
				            </div>
				        </div>
					    <hr>
				        <div class="survey-section">
				            <p class="question-title">선호 차량 유형</p>
				            <hr>
				            <div class="input-group">
				                <input type="checkbox" id="vt1" name="vehicleType" value="세단">
				                <label for="type_sedan">세단</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="vt2" name="vehicleType" value="SUV">
				                <label for="type_suv">SUV</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="vt3" name="vehicleType" value="other">
				                <label for="vehicleTypeOther">기타</label>
				            </div>
				        </div>
				    		<hr>
				        <div class="survey-section">
				            <p class="question-title">선호 엔진</p>
				            <hr>
				            <div class="input-group">
				                <input type="checkbox" id="et1" name="engineType" value="가솔린">
				                <label for="engine_gas">가솔린</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="et2" name="engineType" value="전기">
				                <label for="engine_ev">전기</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="et3" name="engineType" value="하이브리드">
				                <label for="engine_hybrid">하이브리드</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="et4" name="engineType" value="수소">
				                <label for="engine_fcev">수소</label>
				            </div>
				            <div class="input-group">
				                <input type="checkbox" id="et5" name="engineType" value="고성능 (N)">
				                <label for="engine_n">고성능 (N)</label>
				            </div>
				            <div class="input-group">
				                <label for="counselingLikeTime">희망연락시간</label>
				                <input type="text"  id="counselingLikeTime" name="counselingLikeTime"  placeholder="원하시는 시간을 적어주세요.">
				            </div>
				        </div>
	
				    	</div>
				</div>
			</div>
			<div class="btns">
		         <input type="button" value="구매신청" id="btnApply">
		         <input type="reset" value="취소">
			</div>	
			<br>
			<hr>
			<br>
			<div>
			    <p class="result"></p>
			</div> 		
		</form>
	</div>
</body>


<script>
    let items = document.querySelectorAll(".accordion-item");

    items.forEach((item) => {
        let header = item.querySelector(".accordion-header");

        header.addEventListener("click", () => {
            let openItem = document.querySelector(".accordion-content.open");

            // 열려 있는 패널이 있고, 그게 지금 클릭한 것이 아니라면 닫기
            if (openItem && openItem !== item.querySelector(".accordion-content")) {
                openItem.classList.remove("open");
                openItem.previousElementSibling.querySelector(".accordion-arrow").style.transform = "rotate(0deg)";
            }

            // 현재 패널 open/close toggle
            let content = item.querySelector(".accordion-content");
            let arrow = item.querySelector(".accordion-arrow");
            content.classList.toggle("open");

            // 화살표 회전
            if (content.classList.contains("open")) {
                arrow.style.transform = "rotate(180deg)";
            } else {
                arrow.style.transform = "rotate(0deg)";
            }
        });
    });
	
	document.addEventListener("DOMContentLoaded", () => {

		let text = "";
		let form = document.applyForm;
		let result = document.querySelector(".result");
		let btnApply = document.querySelector("#btnApply");
		btnApply.addEventListener("click", () => {
			let purchasePurposeList = [];
			let engineTypeList = [];
			let vehicleTypeList = [];
			let purchasePurpose = document.querySelectorAll("[name=purchasePurpose]");    
			let engineType = document.querySelectorAll("[name=engineType]");    
			let purchasePeriod = form.purchasePeriod.value;
			let vehicleType = document.querySelectorAll("[name=vehicleType]");      
			//let vehicleTypeOther = form.vehicleTypeOther.value;
			let sido = document.querySelector("#sido");
			let siGunGu = document.querySelector("#siGunGu");
			let eupMyeonDong = document.querySelector("#eupMyeonDong");
			let counselingLikeTime = form.counselingLikeTime.value;
			
			purchasePurpose.forEach(v  => {
			    if (v.checked) {
			        purchasePurposeList.push(v.value);
			    }
			});
			
			engineType.forEach(v  => {
			    if (v.checked) {
			        engineTypeList.push(v.value);
			    }
			});

			
			vehicleType.forEach(v  => {
			    if (v.checked) {
			        vehicleTypeList.push(v.value);
			    }
			});
			
			
			
			let txt = `선호 엔진: ${engineTypeList} <br>희망 구매 시점: ${purchasePeriod}<br>차량 구매 목적: ${purchasePurposeList}<br>선호 차량: ${vehicleTypeList}<br><br>
			    시도: ${sido.value} <br> 시군구: ${siGunGu.value} <br>읍면동: ${eupMyeonDong.value}`;
			    result.innerHTML = txt;
			
		})
	});	
</script>


</html>
