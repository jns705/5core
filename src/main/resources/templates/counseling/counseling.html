<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매상담 신청</title>
    <link rel="stylesheet" href="css/counseling.css">
	<style>
		body {
		    font-family: 'Noto Sans KR', sans-serif;
		    background: #f7f5f2;
		    margin: 0;
		    padding: 0;
		    color: #222;
		}

		/* 상단 헤더 */
		.header {
		    text-align: center;
		    padding: 60px 20px 40px;
		    background: #efe9e2;
		}

		.header h1 {
		    font-size: 36px;
		    margin-bottom: 10px;
		}

		.header p {
		    color: #666;
		}

		/* 스텝 프로세스 */
		.steps {
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    margin: 60px auto;
		    max-width: 1100px;
		    gap: 20px;
		    flex-wrap: wrap;
		}

		.step {
		    text-align: center;
		}

		.icon-circle {
		    width: 110px;
		    height: 110px;
		    background: #e8ded3;
		    border-radius: 50%;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    margin: 0 auto 10px;
		}

		.icon-circle img {
		    width: 80px;
		    opacity: 0.8;
		}

		.step-title {
		    font-size: 15px;
		    font-weight: 500;
		}

		.arrow img{
		    /* font-size: 30px;
		    font-weight: bold;
		    color: #444;
		    align-items: center;
		    margin: 28px 0 0 0; */
		    width: 30px;
		    margin: 45px 0 0 0;
		}
		.arrow2 img{
		    width: 30px;
		    margin: 45px 0 0 0;
		}

		/* 버튼 */
		.btn-area {
		    display: flex;
		    justify-content: center;
		    gap: 20px;
		    margin-bottom: 100px;
		}

		.submit-btn {
		    background: #002c5f;
		    color: #fff;
		    padding: 16px 36px;
		    border: none;
		    font-size: 16px;
		    cursor: pointer;
		    border-radius: 4px;
		}

		.sub-btn {
		    background: #fff;
		    border: 1px solid #aaa;
		    padding: 16px 28px;
		    font-size: 16px;
		    cursor: pointer;
		    border-radius: 4px;
		}

		.submit-btn:hover {
		    background: #003a7c;
		}

		.sub-btn:hover {
		    background: #f3f3f3;
		}

		
		
		
	</style>
</head>

<body>
<header class="header">
    <h1>구매상담 신청</h1>
    <p>현대자동차 차량 구매 정보를 신속하고 정확하게 알려드립니다.</p>
</header>

<!-- 프로세스 step -->
<div class="container">
    <section class="steps">
        <div class="step">
            <p class="step-title">01. 차량 선택</p>
            <div class="icon-circle">
                <img src="./img/icon/drive.png">
            </div>
        </div>
        <div class="arrow">
            <img src="./img/icon/arrow.png">
        </div>
        <div class="step">
            <p class="step-title">02. 구매상담 매장/지역 선택</p>
            <div class="icon-circle">
                <img src="./img/icon/destination.png">
            </div>
        </div>
        <div class="arrow2">
            <img src="./img/icon/arrow.png">
        </div>
        <div class="step">
            <p class="step-title">03. 구매 희망 정보</p>
            <div class="icon-circle">
                <img src="./img/icon/test.png">
            </div>
        </div>
        <div class="arrow">
            <img src="./img/icon/arrow.png">
        </div>
        <div class="step">
            <p class="step-title">04. 구매상담 신청 완료</p>
            <div class="icon-circle">
                <img src="./img/icon/success.png">
            </div>
        </div>
        <div class="arrow">
            <img src="./img/icon/arrow.png">
        </div>
        <div class="step">
            <p class="step-title">05. 안내전화 및 상담 진행</p>
            <div class="icon-circle">
                <img src="./img/icon/car.png">
            </div>
        </div>
    </section>
</div>

<!-- 버튼 -->
<section class="btn-area">
    <a class="submit-btn" th:href="@{/counseling/detail}">구매상담 신청</a>
    <a class="sub-btn">메인으로</a>
</section>

</body>
</html>
