<style>
/* 전체 */
.hyu-header {
    background: white;
}

.main-logo {
	margin-bottom: 20px;	
}

/* 로고 글자 */
.hyu-logo-text {
    font-weight: bold;
    text-decoration: none;
    color: #333;
}

/* 중앙 메뉴 */
.hyu-nav {
    list-style: none;
    display: flex;
    gap: 24px;
    padding: 0;
}

.hyu-nav-li-1 {
	margin-left: -450px;	
}

.hyu-nav-li-2 {
	margin-left: -410px;	
}

.hyu-nav-li-3 {
	margin-left: -240px;	
}


.hyu-nav-link {
    position: relative;
    padding: 6px 0;
    font-size: 0.9em;
    color: #444;
    text-decoration: none;
    transition: color 0.2s;
}

#menu-icon {
	color: #444;
}
#menu-icon:hover svg {
	 fill: #0d6efd; 
}

/* hover / active 시 밑줄 효과 */
.hyu-nav-link::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0%;
    height: 2px;
    background: #0d6efd;  
    transition: width 0.25s ease-in-out;
}

.hyu-nav-link:hover::after,
.hyu-nav-link.active::after {
    width: 100%;
}

.hyu-nav-link:hover {
    color: black;
}


.hyu-search-btn {
    border-radius: 4px;
}


.hyu-user-link:hover {
    color: black;
}

/* 로그인, 회원가입 아이콘 색 변경 */
.nav-link svg {
    transition: fill 0.2s ease;
}

/* 마우스를 올렸을 때 */
.nav-link:hover svg {
    fill: #0d6efd;  
}

/* 클릭(active)했을 때 */
.nav-link:active svg {
    fill: #0a58ca; 
}



</style>
