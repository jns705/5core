<header class="pb-3 mb-5 border-bottom">
  <div class="container d-flex align-items-center hyu-header">

    <!-- 왼쪽: 로고 -->
    <div class="main-logo">
      <a th:href="@{/main}">
        <img th:src="@{/icons/topmainLogo.png}" class="main-logo-image">
      </a>
    </div>
	<!-- 중앙 메뉴 -->
	<!--ul class="hyu-nav d-flex position-absolute start-50 translate-middle-x mb-0"-->
	<ul class="hyu-nav d-flex">	
	  <li><a th:href="@{/vehicles}" class="hyu-nav-link">모델</a></li>
	  <li><a href="#" class="hyu-nav-link">구매</a></li>
	  <li><a th:href="@{/bluemembers}" class="hyu-nav-link">블루멤버스</a></li>
	  <li><a href="#" class="hyu-nav-link">보조금 · 충전소 안내</a></li>
	  <li><a href="#" class="hyu-nav-link">고객 센터</a></li>
	  <li><a th:href="@{/event}" class="hyu-nav-link">이벤트</a></li>
	  <li><a th:href="@{/support}" class="hyu-nav-link">고객 센터</a></li>
	</ul>
	<!-- 오른쪽: 로그인 / 검색 / 메뉴 / 관리자 -->
	<div class="header-actions">
		<!-- 로그인 (비로그인 상태) -->
	    <a sec:authorize="isAnonymous()" th:href="@{/login}" class="nav-link">
	        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
	            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
	        </svg>
	    </a>

	    <!-- 로그인 상태 -->
	    <a sec:authorize="isAuthenticated()" th:href="@{|/member/update/${#authentication.getPrincipal().getUsername()}|}" class="nav-link">
	        <span class="a-id">[[${#authentication.getPrincipal().getUsername()}]]</span>님
	    </a>
	    <a sec:authorize="isAuthenticated()" th:href="@{/logout}" class="nav-link">로그아웃</a>

	    <!-- 검색 아이콘 -->
	    <a href="#" class="nav-link">
	        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
	            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
	        </svg>
	    </a>

	    <!-- 메뉴 아이콘 (햄버거) -->
	    <a href="#" class="nav-link">
	        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
	            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
	        </svg>
	    </a>
	    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/add}" class="nav-link">관리자</a>
	</div>
</header>

<style>
.hyu-header {
	height: 80px;
	display: flex;
	align-items: center;
}

/* 왼쪽 로고 */
.main-logo {
	flex: 0 0 auto;
	margin-right: 300px; /* 로고만 왼쪽으로 붙이고 나머지는 원래 flex 위치 유지 */
}

.main-logo img {
	padding: 0 150px;
    height: 80px;
}

/* 중앙 메뉴 */
.hyu-nav {
    list-style: none;
    display: flex;
    gap: 40px;
    margin: 0;
    padding: 50px;
}

.hyu-nav-link {
    color: black;
    text-decoration: none;
    position: relative;
}

/* 메뉴 밑줄 효과 */
.hyu-nav-link::after {
    content: "";          /* 이게 필수! */
    position: absolute;
    bottom: -2px;
    left: -0;
    width: 0;
    height: 2px;
    background: navy;
    transition: width 0.25s ease;
}

.hyu-nav-link:hover::after {
    width: 100%;
}
/* 오른쪽 아이콘/로그인 그룹 */
.header-actions {
    display: flex;        /* flex 적용 필수 */
    align-items: center;
    gap: 20px;            /* 아이콘/링크 사이 간격 */
    /* margin-left: auto;  오른쪽 끝으로 밀기 */
}

.hyu-nav-link {
    font-size: 1.0em; /* 메뉴 글씨 크게 */
    color: black;
    text-decoration: none;
    position: relative;
}
.nav-link {
    display: flex;
    align-items: center;
    color: black;
    text-decoration: none;
    font-size: 1em;
    transition: color 0.2s;
}

.nav-link svg {
    margin-left: 0; /* margin 제거 */
    transition: fill 0.2s;
}

.nav-link:hover svg {
    fill: #007bff;
}
</style>
