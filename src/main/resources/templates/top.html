<header class="pb-3 mb-5 border-bottom">
  <div class="container d-flex align-items-center hyu-header">

    <!-- 왼쪽: 로고 -->
    <div class="main-logo">
      <a th:href="@{/main}">
        <img th:src="@{/icons/topmainLogo.png}" class="main-logo-image">
      </a>
    </div>
	<!-- 중앙 메뉴 -->
	<!--ul class="hyu-nav d-flex position-absolute start-50 translate-middle-x mb-0"-->
	<ul class="hyu-nav d-flex">	
	  <li><a th:href="@{/vehicles}" class="hyu-nav-link">모델</a></li>
	  <li><a href="#" class="hyu-nav-link">구매</a></li>
	  <li><a href="#" class="hyu-nav-link">지점 및 정비소 찾기</a></li>
	  <li><a href="#" class="hyu-nav-link">보조금 · 충전소 안내</a></li>
	  <li><a href="#" class="hyu-nav-link">고객 센터</a></li>
	  <li><a href="#" class="hyu-nav-link">이벤트</a></li>
	</ul>

<!-- 오른쪽: 로그인 / 검색 / 메뉴 / 관리자 -->
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
        </a>
        <a sec:authorize="isAuthenticated()" th:href="@{|/member/update/${#authentication.getPrincipal().getUsername()}|}" class="nav-link">
            <span class="a-id">[[${#authentication.getPrincipal().getUsername()}]]</span>님
        </a>
        <a sec:authorize="isAuthenticated()" th:href="@{/logout}" class="nav-link">로그아웃</a>
        <!-- 검색 아이콘 -->
        <a href="#" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
        </a>
        <!-- 메뉴 아이콘 -->
        <a href="#" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
            </svg>
        </a>
        <!-- 관리자 -->
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/add}" class="nav-link">#####</a>
    </div>
</header>

<style>
.hyu-header {
	height: 130px;
	display: flex;
	align-items: center;
}

/* 왼쪽 로고 */
.main-logo {
	flex: 0 0 auto;
	margin-right: 500px; /* 로고만 왼쪽으로 붙이고 나머지는 원래 flex 위치 유지 */
}

.main-logo img {
	padding: 0 150px;
    height: 100px;
}

/* 중앙 메뉴 */
.hyu-nav {
    list-style: none;
    display: flex;
    gap: 50px;
    margin: 0;
    padding: 0;
}

.hyu-nav-link {
    color: black;
    text-decoration: none;
    position: relative;
}

/* 메뉴 밑줄 효과 */
.hyu-nav-link::after {
    content: "";          /* 이게 필수! */
    position: absolute;
    bottom: -2px;
    left: -0;
    width: 0;
    height: 2px;
    background: navy;
    transition: width 0.25s ease;
}

.hyu-nav-link:hover::after {
    width: 100%;
}

/* 메뉴중앙 액션 */
.header-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}
.hyu-nav-link {
    font-size: 1.5em; /* 메뉴 글씨 크게 */
    color: black;
    text-decoration: none;
    position: relative;
}
/* 아이콘 액션 */
.nav-link svg {
    fill: black; /* 기본 색상 검정 */
    transition: fill 0.2s;
    margin-left: 50px;
}
.nav-link:hover svg {
    fill: #007bff;
}
</style>
