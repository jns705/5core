<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>차량 상세보기</title>
	<th:block th:replace="~{/top.html}"></th:block>
	<style>


		/* 전체 레이아웃 컨테이너 */
		.container {
			max-width: 2000px;
			margin: 40px auto;
		    gap: 44px;
			text-align: justify;
		}
		
		.vehicle-detail {
			max-width: 1520px;
			position: relative;
			left: 240px;
		}

		.vehicle-header {
		    display: flex;
		    justify-content: space-between;
		    align-items: flex-end;
		    border-bottom: 1px solid #eee;
		    padding-bottom: 20px;
		    margin-bottom: 40px;
		}

		.vehicle-title h1 {
		    font-size: 30px;
		    font-weight: 700;
		}

		.vehicle-title p {
		    margin-top: 6px;
		    color: #777;
		}

		.price {
		    font-size: 26px;
		    font-weight: bold;
		}

		.detail-wrap {
		    display: flex;
		    gap: 40px;
		}

		.image-section {
			width: 500px;
		    flex: 1;
		}

		.image-section img {
		    width: 100%;
		    border-radius: 14px;
		}

		.color-picker {
		    display: flex;
		    gap: 10px;
		    margin-top: 20px;
		}

		.color-circle {
		    width: 28px;
		    height: 28px;
		    border-radius: 50%;
		    border: 2px solid #ddd;
		    cursor: pointer;
		}

		.info-section {
			width: 500px;
		    flex: 1;
		}

		.spec-table {
		    width: 100%;
		    border-collapse: collapse;
		    margin-bottom: 30px;
		}

		.spec-table td {
		    padding: 12px 0;
		    border-bottom: 1px solid #f0f0f0;
		}

		.spec-table td:first-child {
		    width: 140px;
		    color: #666;
		}

		.option-box {
		    background: #f9fafc;
		    border-radius: 12px;
		    padding: 20px;
		}

		.option-list {
		    list-style: none;
		    display: grid;
		    grid-template-columns: repeat(2, 1fr);
		    gap: 12px;
		}

		.option-list li {
		    background: #fff;
		    padding: 10px 14px;
		    border-radius: 8px;
		    border: 1px solid #eee;
		}

		.action-buttons {
		    margin-top: 30px;
		    display: flex;
		    gap: 16px;
		}

		.btn {
		    flex: 1;
		    padding: 16px;
		    border-radius: 30px;
		    border: none;
		    font-size: 15px;
		    cursor: pointer;
		}

		.btn.primary {
		    background: #002c5f;
		    color: #fff;
		}

		.btn.secondary {
		    background: #eeeeee;
		}		
	</style>
</head>

<body>
<div class="container">
	<div class="vehicle-detail">
		<div class="vehicle-header">
		    <div class="vehicle-title">
		        <h1>그랜저</h1>
		        <p>현대 · 세단 · 2025</p>
		    </div>
		    <div class="price">KRW 39,000,000 ~</div>
		</div>
		
		<div class="detail-wrap">
		
		    <div class="image-section">
		        <img th:src="@{|/images/${vehicle.fileName}|}" alt="그랜저">
		        <div class="color-picker">
		            <div class="color-circle" style="background:#ffffff"></div>
		            <div class="color-circle" style="background:#000000"></div>
		            <div class="color-circle" style="background:#cfcfcf"></div>
		            <div class="color-circle" style="background:#6d6d6d"></div>
		        </div>
		    </div>
		
		    <div class="info-section">
		        <table class="spec-table">
		            <tr><td>연료</td><td>가솔린</td></tr>
		            <tr><td>배기량</td><td>2497cc</td></tr>
		            <tr><td>변속기</td><td>자동 8단</td></tr>
		            <tr><td>연비</td><td>12.1km/L</td></tr>
		        </table>
		
		        <div class="option-box">
		            <h3>기본 옵션</h3>
		            <ul class="option-list">
		                <li>스마트 크루즈 컨트롤</li>
		                <li>파노라마 선루프</li>
		                <li>열선 시트</li>
		                <li>12.3인치 내비게이션</li>
		            </ul>
		        </div>
		
		        <div class="action-buttons">
		            <button class="btn primary">견적 계산</button>
		            <button class="btn secondary">시승 신청</button>
		        </div>
		    </div>
		
		</div>
	</div>
</div>
	<th:block th:replace="~{/bottom.html}"></th:block>
</body>

</html>
