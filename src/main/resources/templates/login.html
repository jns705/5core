<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login폼</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        /* 전체 */
        body {
            background-color: #eee;
            font-family: "Mukta", "Sunflower", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        a {text-decoration: none; color : #000; cursor: pointer;}
        button {cursor: pointer;}
        #container {
            width : 1600px;
            margin : 0 auto;
        }


        /* 중단 */
        .login_menu { width: 100%; height: 600px; margin: 50px auto; text-align: center;}
        .login_box {position: absolute; width: 700px; height: 580px; left: 600px; background-color: #fff; z-index: 1;}
        h1 {font-size: 3em;}
        .login_box1 { margin: 50px auto;}
        .login_box1 { clear: both; width: 600px; height: 150px;}
        .login_input_box { float: left;}
        .login_input_box > input { display: block; width: 430px; height: 50px; margin-bottom: 20px;}
        #loginBtn, #orderSearch { margin-left: 30px; background-color: #000; color: #fff;}
        #loginBtn { width: 132px; height: 132px;}

        .login_tap, .login_box2 { display: flex; justify-content:center; align-items:center; width: 100%; margin: -10px 0 50px 0;}
 		
        .join_box {width: 600px; height: 70px; background-color: #7f8c8d;}
        .join_box a { margin: 50px; line-height: 72px;}
	
		.login_box3 { width: 600px; display: none; justify-content:center; align-items:center; }
		.join_box2 { margin: 10px; width: 150px; height: 50px; background-color: #7f8c8d;}
        .join_box2 a { margin: 50px; line-height: 50px;}

        /* 하단 */


    </style>
	<script>
		let flag = false;
	    document.addEventListener("DOMContentLoaded", () => {
	        let tap1 = document.querySelector(".tap1");
	        let login_box3 = document.querySelector(".login_box3");
			
			tap1.addEventListener("click", () => login_box_changer(flag));
			
	        let login_box_changer = (flag) => {
				console.log(flag)
	            if(!flag){
					flag = true;
	                login_box3.style.display = "flex";
	            } else {
					flag = false;
	                login_box3.style.display = "none";
	            }
	        };

	        
	    });
		
		function addCustomer() { 
			location.href = "/5core/member/add/" + "01";
		}
		function addDealer() { 
			location.href = "/5core/member/add/" + "02";
		}
		
	</script>
	
</head>
<body>
<div id="container">
    <!-- 상단 -->


    <!-- 중단 -->
    <div class="login_menu">
        <div class="login_box">
		<!-- 로그인 실패 처리 -->
		<div th:if="${error}" class="alert alert-danger mb-5">
			<div>Username 또는 Password가 올바르지 않습니다.</div>
		</div>
        <form th:action="@{/login}" method="post" class="form1">
            <h1>로그인</h1>
            <div class="login_box1">
                <div class="login_input_box">
                    <input type="text" name="username" id="username" placeholder="아이디">
                    <input type="password" name="password" id="password" placeholder="비밀번호">
                </div>
                <input type="submit" value="로그인" id="loginBtn">
            </div>

            <div class="login_box2">
                <div class="join_box">
                    <a href="#">아이디 찾기</a>
                    <a href="#">비밀번호 찾기</a>
                    <a class="tap1">회원가입</a>
                </div>
            </div>
			
			<div class="login_box3">
				<div class="join_box2">
					<a th:href="|javascript:addCustomer()|">고객</a>
				</div>
				<div class="join_box2">
					<a th:href="|javascript:addDealer()|">딜러</a>
				</div>
			</div>
        </form>
        </div>
    </div>

    <!-- 하단 -->

</div>
</body>
</html>
