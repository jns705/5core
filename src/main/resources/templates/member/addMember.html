<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        /* 전체 */
        @import url('https://fonts.googleapis.com/css2?family=Love+Light&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Sunflower:wght@300&display=swap');
        body {
            background-color: #eee;
            font-family: "Mukta", "Sunflower", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        a {text-decoration: none; color : #000; cursor: pointer;}
        button {cursor: pointer;}
        #container {
            width : 1600px;
            margin : 0 auto;
        }

        /* 중단 - 회원가입 */
        .join {
            text-align: center;
            width: 100%; height: 1400px; margin: 0;
            background-color: #fff;
            border: 1px solid #fff;
        }
        .join_form {
            width: 100%; margin: 50px 0;
        }
        .join_form ul li{
            list-style-type : none;
            display: inline-block;
        }

        .join_label, .join_input {
            display: inline-block;
        }

        .join_label {
            width: 110px;
        }
        .join_input input {
            margin-left: 10px;
            width: 240px; height: 30px;
        }
        .center_title {
            margin: 50px 0; font-size: 1.2em;
        }
        .radioBox {
            display: inline-block;
        }
        .radioBox > label {
            display: inline-block; width: 100px; border: 1px solid #000; border-radius: 10px;
        }
        input[name=gender], input[name=foreigner] {
            display: none;
        }
        .radio_check {
            font-size: 1.5em; cursor: pointer; 
        }
        input[name=gender]:checked + label, input[name=foreigner]:checked + label {
            color: #fff; border: 1px solid #90cbfb; background-color: #90cbfb;
        }
		
    </style>
    <script>
		
		function searchAddress() {
			new daum.Postcode({
		        oncomplete: function(data) {
		            document.getElementById("zipcode").value = data.zonecode;
					document.getElementById("basicAddress").value = data.address;
		        }
		    }).open();
		}
		
        document.addEventListener("DOMContentLoaded", () => {
			
        });
    </script>
</head>
<body>
<div id="container">
	<!-- 상단 -->


    <!-- 중단 -->
    <div class="join">
        <form th:object="${member}" th:action="@{/member/add}" method="post">
			<input type="hidden" name="roleCheck" th:field="*{roleCheck}">
            <div class="join_form">
                <div>
                    <h1>회원가입</h1>
                </div>

                <div class="join_detail_form">
                    <div>
                        <div class="join_label"><label for="memberId">아이디</label></div>
                        <div class="join_input"><input type="text" name="memberId" th:field="*{memberId}" autofocus></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{memberId}"></p>		
						</div>
                    </div>
                    
                    <div>
                        <div class="join_label"><label for="password">비밀번호</label></div>
                        <div class="join_input"><input type="password" name="password" id="password"></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{password}"></p>
						</div>
                    </div>
                   
                    <div>
                        <div class="join_label"><label for="password2">비밀번호 확인</label></div>
                        <div class="join_input"><input type="password" name="password2" id="password2"></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{password2}"></p>
						</div>
                    </div>

                    <div>
                        <div class="join_label"><label for="name">이름</label></div>
                        <div class="join_input"><input type="text" name="name" id="name"></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{name}"></p>
						</div>
                    </div>
                    
                    <div>
                        <div class="join_label"><label for="phone">휴대폰 번호</label></div>
                        <div class="join_input"><input type="tel" name="phone" id="phone"></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{phone}"></p>
						</div>
                    </div>
                    
                    <div>
                        <div class="join_label"><label for="email">이메일</label></div>
                        <div class="join_input"><input type="email" name="email" id="email"></div>
						<div class="col-sm-7">
							<p class="text-danger" th:errors="*{email}"></p>
						</div>
                    </div>

                    <div>
                        <div class="radioBox"><input type="radio" name="gender" value="남성" id="gender1"><label for="gender1" class="radio_check">남성</label></div>
                        <div class="radioBox"><input type="radio" name="gender" value="여성" id="gender2"><label for="gender2" class="radio_check">여성</label></div>
                    </div>
					<div class="col-sm-4">
						<p class="text-danger" th:errors="*{gender}"></p>
					</div>
					
					
					<div class="mb-3 row">
						<label class="col-sm-2 control-label">국가명</label>
						<div class="col-sm-3">
							<select name="address.country" class="form-control" th:field="*{address.country}">
								<option value="한국">한국</option>
								<option value="일본">일본</option>
								<option value="중국">중국</option>
								<option value="미국">미국</option>
								<option value="영국">영국</option>
								<option value="프랑스">프랑스</option>
							</select>
						</div>
						<div class="col-sm-4">
							<p class="text-danger" th:errors="*{address.country}"></p>
						</div>
					</div>
					
					<div class="mb-3 row">
						<label class="col-sm-2 control-label">우편번호</label>
						<div class="col-sm-3">
							<input type="text" name="address.zipcode" class="form-control" id="zipcode" th:field="*{address.zipcode}" readonly>
						</div>
						<div class="col-sm-2">
							<a th:href="|javascript:searchAddress()|" class="btn btn-success" role="button">주소검색</a>
						</div>
						<div class="col-sm-4">
							<p class="text-danger" th:errors="*{address.zipcode}"></p>
						</div>
					</div>
					<div class="mb-3 row">
						<label class="col-sm-2 control-label">기본 주소</label>
						<div class="col-sm-5">
							<input type="text" name="address.basicAddress" class="form-control" id="basicAddress" th:field="*{address.basicAddress}" readonly>
						</div>
						<div class="col-sm-4">
							<p class="text-danger" th:errors="*{address.basicAddress}"></p>
						</div>
					</div>
					<div class="mb-3 row">
						<label class="col-sm-2 control-label">상세 주소</label>
						<div class="col-sm-5">
							<input type="text" name="address.detailAddress" class="form-control" th:field="*{address.detailAddress}">
						</div>
						<div class="col-sm-4">
							<p class="text-danger" th:errors="*{address.detailAddress}"></p>
						</div>
					</div>
					
					
					<!-- 고객 회원가입 -->
					<div th:if="${member.roleCheck == '01'}">
						<div>고객</div>
					</div>
					
					<!-- 딜러 회원가입 -->
					<div th:if="${member.roleCheck == '02'}">
						<div>딜러</div>		
					</div>
					
                </div>

            <input type="submit" value="가입하기">
        </form>
    </div>

    <!-- 하단 -->


</div>
</body>
</html>
