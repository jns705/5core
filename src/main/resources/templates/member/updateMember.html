<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원수정 - HYUNDAI CRM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f3f5f9;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 상단/하단 바 (링크 교체용) */
    .page-header,
    .page-footer {
      height: 46px;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .page-header__title {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* 전체 레이아웃 */
    .layout {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .shell {
      width: 100%;
      max-width: 980px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      display: flex;
      overflow: hidden;
      min-height: 520px;
    }

    /* 좌측 메뉴 */
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #0d47a1 0%, #093272 100%);
      color: #eef3ff;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
    }

    .sidebar__section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .sidebar__menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sidebar__item {
      border-radius: 9px;
      overflow: hidden;
    }

    .sidebar__link {
      display: block;
      padding: 10px 12px;
      font-size: 14px;
      color: #e5ecff;
      opacity: 0.9;
      transition: background 0.18s ease, opacity 0.18s ease, transform 0.1s ease;
      position: relative;
    }

    .sidebar__link::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: #ffffff;
      border-radius: 999px;
      transition: height 0.18s ease;
    }

    .sidebar__link:hover {
      background: rgba(255, 255, 255, 0.16);
      opacity: 1;
      transform: translateY(-1px);
    }

    .sidebar__link--active {
      background: #ffffff;
      color: #0d47a1;
      font-weight: 600;
      opacity: 1;
    }

    .sidebar__link--active::before {
      height: 70%;
    }

    .sidebar__caption {
      margin-top: auto;
      font-size: 11px;
      opacity: 0.7;
    }

    /* 메인 영역 */
    .main {
      flex: 1;
      padding: 26px 30px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at top left, #e3eefc 0, transparent 55%);
    }

    .main__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .main__title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #0d47a1;
    }

    .page-subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    .chip-current {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid #0d47a1;
      color: #0d47a1;
      background: #e3eefc;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 폼 카드 */
    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 22px 24px 24px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
    }

    .card__title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #111827;
    }

    .card__subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .form-label span.required {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-input {
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      color: #111827;
      background: #ffffff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #0d47a1;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .form-input[readonly],
    .form-input[disabled] {
      background: #f3f4f6;
      color: #6b7280;
      cursor: default;
      box-shadow: none;
    }

    /* 성별 */
    .gender-group {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #374151;
      margin-top: 3px;
    }

    .gender-option input {
      margin-right: 5px;
    }

    /* 주소 2칸 병합 */
    .form-group--full {
      grid-column: 1 / -1;
    }

    .address-row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 10px;
    }

    .helper-text {
      font-size: 11px;
      color: #9ca3af;
    }

    /* 버튼 영역 */
    .form-actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease,
        transform 0.08s ease, box-shadow 0.16s ease;
    }

    .btn--ghost {
      background: #ffffff;
      color: #374151;
      border-color: #d1d5db;
    }

    .btn--ghost:hover {
      background: #f3f4f6;
    }

    .btn--primary {
      background: #0d47a1;
      color: #ffffff;
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.18);
    }

    .btn--primary:hover {
      background: #0b3b86;
      transform: translateY(-1px);
      box-shadow: 0 9px 18px rgba(15, 23, 42, 0.24);
    }

    /* 반응형 */
    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        align-items: center;
        padding: 16px 14px;
        gap: 16px;
      }

      .sidebar__section-title {
        margin-bottom: 0;
      }

      .sidebar__menu {
        flex-direction: row;
        gap: 6px;
        overflow-x: auto;
      }

      .sidebar__caption {
        display: none;
      }

      .main {
        padding: 18px 18px 22px;
      }
    }

    @media (max-width: 720px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .address-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 검정 헤더 (링크 include 예정 영역) -->
  <header class="page-header">
    <div class="page-header__title">HYUNDAI CRM · 회원수정</div>
  </header>

  <div class="layout">
    <div class="shell">
      <!-- 좌측 메뉴 -->
      <aside class="sidebar" aria-label="마이페이지 메뉴">
        <div class="sidebar__section-title">마이페이지</div>
        <ul class="sidebar__menu">
          <li class="sidebar__item">
            <a href="#" class="sidebar__link">상담 목록</a>
          </li>
          <li class="sidebar__item">
            <a href="#" class="sidebar__link sidebar__link--active">회원수정</a>
          </li>
          <li class="sidebar__item">
            <a href="#" class="sidebar__link">구매 내역</a>
          </li>
          <li class="sidebar__item">
            <a href="#" class="sidebar__link">관심 차량</a>
          </li>
        </ul>
        <div class="sidebar__caption">로그인한 계정 정보를 수정할 수 있습니다.</div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <main class="main" aria-label="회원정보 수정">
        <div class="main__header">
          <div class="main__title-block">
            <h1 class="page-title">회원 정보 수정</h1>
            <p class="page-subtitle">아이디 및 기본정보는 변경할 수 없으며, 비밀번호와 연락처 · 이메일 · 주소만 수정 가능합니다.</p>
          </div>
          <span class="chip-current">현재 페이지 · 회원수정</span>
        </div>

        <section class="card" aria-label="회원 정보 수정 폼">
          <h2 class="card__title">기본 정보</h2>
          <p class="card__subtitle">필수 항목을 확인 후 정보를 수정해 주세요.</p>

          <form id="memberEditForm" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="userId" class="form-label">아이디</label>
                <input id="userId" name="userId" type="text" class="form-input" value="honggildong" readonly />
              </div>

              <div class="form-group">
                <label for="name" class="form-label">이름</label>
                <input id="name" name="name" type="text" class="form-input" value="홍길동" readonly />
              </div>

              <div class="form-group">
                <label class="form-label">성별</label>
                <div class="gender-group">
                  <label class="gender-option">
                    <input type="radio" name="gender" value="M" checked disabled /> 남성
                  </label>
                  <label class="gender-option">
                    <input type="radio" name="gender" value="F" disabled /> 여성
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label for="phone" class="form-label">연락처<span class="required">*</span></label>
                <input id="phone" name="phone" type="tel" class="form-input" value="010-1234-5678" placeholder="예) 010-1234-5678" />
              </div>

              <div class="form-group">
                <label for="email" class="form-label">이메일<span class="required">*</span></label>
                <input id="email" name="email" type="email" class="form-input" value="hong@example.com" placeholder="예) hong@example.com" />
              </div>

              <div class="form-group">
                <label for="zip" class="form-label">우편번호</label>
                <input id="zip" name="zip" type="text" class="form-input" value="12345" readonly />
              </div>

              <div class="form-group form-group--full">
                <label class="form-label">주소</label>
                <div class="address-row">
                  <input id="addr1" name="addr1" type="text" class="form-input" value="서울특별시 강남구 테헤란로 123" readonly />
                  <input id="addr2" name="addr2" type="text" class="form-input" value="OOO빌딩 10층 1001호" placeholder="상세주소를 입력하세요" />
                </div>
                <p class="helper-text">주소 검색은 마이페이지 상단의 ‘주소 변경’ 기능을 통해 진행됩니다.</p>
              </div>

              <div class="form-group">
                <label for="password" class="form-label">새 비밀번호<span class="required">*</span></label>
                <input id="password" name="password" type="password" class="form-input" placeholder="변경 시에만 입력하세요" autocomplete="new-password" />
                <p class="helper-text">8자 이상, 영문/숫자/특수문자 조합을 권장합니다.</p>
              </div>

              <div class="form-group">
                <label for="passwordConfirm" class="form-label">비밀번호 확인<span class="required">*</span></label>
                <input id="passwordConfirm" name="passwordConfirm" type="password" class="form-input" placeholder="동일한 비밀번호를 다시 입력" autocomplete="new-password" />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn--ghost" onclick="window.history.back();">취소</button>
              <button type="submit" class="btn btn--primary">정보 수정하기</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <!-- 검정 푸터 (링크 include 예정 영역) -->
  <footer class="page-footer"></footer>

  <script>
    // 간단 검증: 비밀번호 일치 및 필수항목 체크
    document.getElementById("memberEditForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const pwd = document.getElementById("password").value.trim();
      const pwd2 = document.getElementById("passwordConfirm").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!phone || !email) {
        alert("연락처와 이메일은 필수 입력입니다.");
        return;
      }

      if (pwd || pwd2) {
        if (pwd.length < 8) {
          alert("비밀번호는 8자 이상으로 입력해 주세요.");
          document.getElementById("password").focus();
          return;
        }
        if (pwd !== pwd2) {
          alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
          document.getElementById("passwordConfirm").focus();
          return;
        }
      }

      // TODO: 실제 수정 요청 처리 (AJAX 또는 form submit)
      alert("회원 정보가 성공적으로 수정되었습니다.");
    });
  </script>
</body>
</html>
